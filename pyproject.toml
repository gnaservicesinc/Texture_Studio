[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ipde"
version = "0.9.1"
description = "Precision-preserving HEIF depth and auxiliary image extractor"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.13,<5",
  "pillow-heif>=1.5.0",
  "OpenEXR>=3.4.4",
  "opt_einsum>=3.3",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.scripts]
ipde = "ipde.cli:main"
raft-studio = "ipde.trainer_cli:main"
media-studio = "ipde.media_cli:main"

[project.optional-dependencies]
datasets = ["datasets>=4,<6"]
photo = ["tifffile>=2025.1"]
raw = ["rawpy>=0.25", "tifffile>=2025.1", "imagecodecs>=2025.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
