<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
<title id="title">Reference depth, aligned stereo fusion and one RAFT depth map</title>
<desc id="desc">A teacher makes one reference depth map from the display photo. Training loss compares the single model prediction with that reference depth. RAFT aligns the right view to the left, combines features into one fused field, and a shared decoder predicts one map. A 768 × 768 tile side covers a 5712 × 4284 map in 8 columns × 6 rows = 48 portions, with smaller boundary tiles. Left-camera disparity uses the native stereo grid.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#126f66"/></marker></defs>
<rect width="900" height="510" fill="#f8fbfb"/>
<g font-family="system-ui,sans-serif" fill="#183846">
<text x="25" y="33" font-size="19" font-weight="700">Reference depth trains one prediction from a stereo pair.</text>
<g font-size="15">
<rect x="25" y="60" width="235" height="97" rx="6" fill="#edf6f4" stroke="#91adaa"/>
<text x="41" y="87" font-weight="700">Full display photo</text><text x="41" y="112">5712 × 4284 RGB</text><text x="41" y="139" font-size="13">Same source for optional anchor</text>
<rect x="320" y="60" width="235" height="97" rx="6" fill="#edf6f4" stroke="#91adaa"/>
<text x="336" y="87" font-weight="700">Teacher</text><text x="336" y="112" font-size="13">DepthPro: fixed 1536 × 1536</text><text x="336" y="139" font-size="13">DA3 / V2: native by default</text>
<rect x="615" y="60" width="260" height="97" rx="6" fill="#126f66"/>
<text x="631" y="87" fill="#fff" font-weight="700">Reference depth map</text><text x="631" y="112" fill="#fff">5712 × 4284</text><text x="631" y="139" fill="#fff" font-size="13">Teacher depth or measured depth</text>
<path d="M270 108H305 M565 108H600" fill="none" stroke="#126f66" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M855 169V244" fill="none" stroke="#126f66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="603" y="193" font-size="13">Loss compares reference depth</text><text x="603" y="215" font-size="13">with predicted depth at each pixel.</text>
<rect x="25" y="250" width="235" height="98" rx="6" fill="#edf6f4" stroke="#91adaa"/>
<text x="41" y="277" font-weight="700">Native left + right</text><text x="41" y="302">Each 2688 × 2016 RGB</text><text x="41" y="329" font-size="13">Encoded whole; no display RGB</text>
<rect x="320" y="250" width="235" height="98" rx="6" fill="#edf6f4" stroke="#91adaa"/>
<text x="336" y="277" font-weight="700">RAFT depth model</text><text x="336" y="302" font-size="13">Right aligned to left by RAFT</text><text x="336" y="329" font-size="13">One fused field; shared query</text>
<rect x="615" y="250" width="260" height="98" rx="6" fill="#126f66"/>
<text x="631" y="277" fill="#fff" font-weight="700">One display depth map</text><text x="631" y="302" fill="#fff">5712 × 4284 float32</text><text x="631" y="329" fill="#fff" font-size="13">Output pixels computed in tiles</text>
<path d="M270 299H305 M565 299H600" fill="none" stroke="#126f66" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="370" font-size="12">768 × 768 pixels per tile; 8 × 6 = 48 portions, with smaller boundary tiles. Output stays one 5712 × 4284 map.</text>
<path d="M25 389H875" stroke="#cddedd"/>
<rect x="25" y="399" width="235" height="63" rx="6" fill="#edf6f4" stroke="#91adaa"/>
<text x="41" y="426" font-weight="700">Native left + right</text><text x="41" y="449" font-size="13">Both views supply model inputs</text>
<rect x="320" y="399" width="235" height="63" rx="6" fill="#edf6f4" stroke="#91adaa"/>
<text x="336" y="426" font-weight="700">RAFT left-camera disparity</text><text x="336" y="449" font-size="13">Existing left-grid decoder</text>
<rect x="615" y="399" width="260" height="63" rx="6" fill="#126f66"/>
<text x="631" y="426" fill="#fff" font-weight="700">Native left-grid prediction</text><text x="631" y="449" fill="#fff" font-size="13">2688 × 2016; separate target units</text>
<path d="M270 430H305 M565 430H600" fill="none" stroke="#126f66" stroke-width="2" marker-end="url(#arrow)"/>
</g><text x="25" y="492" font-size="13" fill="#4d6570">Illustration only. Output size and teacher agreement do not establish measured accuracy.</text>
</g></svg>
