<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="title desc"><title id="title">From a photo to useful depth</title><desc id="desc">First inspect a photo and preserve its original arrays. Then export them, or build reviewed training data, validate on separate scenes, train and compare.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#126f66"/></marker></defs><rect width="820" height="260" fill="#f8fbfb"/><g font-family="system-ui,sans-serif" fill="#183846"><text x="28" y="34" font-size="17" font-weight="700">Keep original data. Review new estimates.</text><g font-size="15"><rect x="28" y="62" width="180" height="64" rx="6" fill="#edf6f4" stroke="#91adaa"/><text x="48" y="88" font-weight="700">1. Inspect</text><text x="48" y="109">What is in the photo?</text><rect x="298" y="62" width="215" height="64" rx="6" fill="#edf6f4" stroke="#91adaa"/><text x="318" y="88" font-weight="700">2. Preserve</text><text x="318" y="109">Export exact original arrays</text><rect x="608" y="62" width="184" height="64" rx="6" fill="#126f66"/><text x="628" y="88" font-weight="700" fill="#fff">3. Use or estimate</text><text x="628" y="109" fill="#fff">Keep units and grid</text><path d="M218 94H282 M523 94H592" stroke="#126f66" stroke-width="2" marker-end="url(#arrow)"/><path d="M405 135V162H83V188" fill="none" stroke="#126f66" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="222" font-weight="700">Review targets</text><text x="260" y="222" font-weight="700">Hold out scenes</text><text x="520" y="222" font-weight="700">Train + compare</text><path d="M170 216H241 M407 216H500" stroke="#126f66" stroke-width="2" marker-end="url(#arrow)"/><text x="440" y="160" font-size="12" fill="#4d6570">Training path, when needed</text></g></g></svg>
