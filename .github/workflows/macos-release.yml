name: Build and release Texture Studio

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify full Xcode and macOS SDK
        run: |
          xcodebuild -version
          ./script/check_toolchain.sh
      - name: Check tag and source versions
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: xcrun swift script/check_release_version.swift
      - name: Test native app and build tools
        run: make test-native
      - name: Build and verify the standalone app
        run: |
          make package
          make smoke
          mkdir -p artifacts
          cp dist/Texture-Studio-macos-arm64.zip dist/Texture-Studio-macos-arm64.sha256 artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: Texture-Studio-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          xcrun swift script/check_release_version.swift --release-notes release-notes.md
          args=(release create "$TAG" artifacts/* --verify-tag --title "Texture Studio $TAG" --notes-file release-notes.md)
          if xcrun swift script/check_release_version.swift --is-prerelease; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
