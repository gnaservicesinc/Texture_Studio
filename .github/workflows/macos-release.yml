name: Build and release Texture Studio

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify full Xcode and macOS SDK
        run: |
          xcodebuild -version
          ./script/check_toolchain.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install optional backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-release-macos.txt \
            -r requirements.txt -r requirements-depth.txt 'datasets>=4,<6'
          python -m pip check
          python -m pip install --no-deps .
      - name: Check tag and source versions
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: python scripts/check_release_version.py
      - name: Test native app and retained Python tools
        run: |
          make test-native
          make PYTHON="$(command -v python)" test-python
      - name: Build and verify the standalone app
        run: |
          make package
          make smoke
          mkdir -p artifacts
          cp dist/Texture-Studio-macos-arm64.zip dist/Texture-Studio-macos-arm64.sha256 artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: Texture-Studio-macos-arm64
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_release_version.py --release-notes release-notes.md
          args=(release create "$TAG" artifacts/* --verify-tag --title "Texture Studio $TAG" --notes-file release-notes.md)
          if python scripts/check_release_version.py --is-prerelease; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
